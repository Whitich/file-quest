name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build and test
        shell: pwsh
        run: |
          $compiler = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe', 'C:\Program Files\Inno Setup 7\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (!$compiler) { throw 'Inno Setup compiler not available' }
          .\build.ps1 -InnoCompiler $compiler
          Compress-Archive -Path dist\FileQuest\* -DestinationPath installer-output\FileQuest-1.1.0-win-x64-portable.zip
          Get-ChildItem installer-output -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content installer-output\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FileQuest-Windows
          path: installer-output/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" installer-output/* --title "File Quest ${{ github.ref_name }}" --notes "Windows x64 installer and portable build. Python is bundled; no separate Python installation is required. The binaries are unsigned, so Windows may show an unknown publisher warning."
